services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: tsfera
      POSTGRES_PASSWORD: tsfera
      POSTGRES_DB: tsfera
    ports:
      - "${TSFERA_POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tsfera"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgres://tsfera:tsfera@postgres:5432/tsfera?sslmode=disable
      HTTP_ADDR: ":8080"
      TSFERA_STORAGE_DIR: /data/attachments
      TSFERA_ENABLE_DOCS_AI: "true"
      TSFERA_ADMIN_USER: admin
      TSFERA_ADMIN_PASSWORD: ${TSFERA_ADMIN_PASSWORD:-admin12345}
      MTS_WEBHOOK_SECRET: ${MTS_WEBHOOK_SECRET:-}
      MTS_BASE_URL: ${MTS_BASE_URL:-}
      MTS_API_TOKEN: ${MTS_API_TOKEN:-}
      DADATA_API_KEY: ${DADATA_API_KEY:-}
      DADATA_BASE_URL: ${DADATA_BASE_URL:-}
      CLOUDPAYMENTS_PUBLIC_ID: ${CLOUDPAYMENTS_PUBLIC_ID:-}
      CLOUDPAYMENTS_API_SECRET: ${CLOUDPAYMENTS_API_SECRET:-}
      CLOUDPAYMENTS_BASE_URL: ${CLOUDPAYMENTS_BASE_URL:-}
    ports:
      - "${TSFERA_BACKEND_PORT:-8080}:8080"
    volumes:
      - attachments:/data/attachments
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "${TSFERA_FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend

volumes:
  pgdata:
  attachments:
