services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: tsfera
      POSTGRES_PASSWORD: tsfera
      POSTGRES_DB: tsfera
    ports:
      - "${TSFERA_POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tsfera"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      # По умолчанию — образ с консольными агентами (claude, codex, agy) для ИИ по подпискам.
      # TSFERA_BACKEND_TARGET=runtime — облегчённый образ без агентов.
      target: ${TSFERA_BACKEND_TARGET:-ai-cli}
      args:
        # Прокси для установки агентов при сборке (claude, codex, agy), если сайты недоступны из региона.
        HTTP_PROXY: ${TSFERA_AI_PROXY:-}
        HTTPS_PROXY: ${TSFERA_AI_PROXY:-}
    environment:
      TSFERA_AI_CLI_HOME: /data/ai-cli
      # Прокси только для консольных агентов, если их сервисы недоступны из региона сервера.
      TSFERA_AI_PROXY: ${TSFERA_AI_PROXY:-}
      DATABASE_URL: postgres://tsfera:tsfera@postgres:5432/tsfera?sslmode=disable
      HTTP_ADDR: ":8080"
      TSFERA_STORAGE_DIR: /data/attachments
      TSFERA_ENABLE_DOCS_AI: "true"
      TSFERA_ADMIN_USER: ${TSFERA_ADMIN_USER:-admin}
      TSFERA_ADMIN_PASSWORD: ${TSFERA_ADMIN_PASSWORD:-admin12345}
      TELEPHONY_PROVIDER: ${TELEPHONY_PROVIDER:-mts}
      MANGO_BASE_URL: ${MANGO_BASE_URL:-https://app.mango-office.ru/vpbx}
      MANGO_API_KEY: ${MANGO_API_KEY:-}
      MANGO_API_SECRET: ${MANGO_API_SECRET:-}
      SIP_WS_URL: ${SIP_WS_URL:-}
      MTS_WEBHOOK_SECRET: ${MTS_WEBHOOK_SECRET:-}
      MTS_BASE_URL: ${MTS_BASE_URL:-}
      MTS_API_TOKEN: ${MTS_API_TOKEN:-}
      DADATA_API_KEY: ${DADATA_API_KEY:-}
      DADATA_BASE_URL: ${DADATA_BASE_URL:-}
      CLOUDPAYMENTS_PUBLIC_ID: ${CLOUDPAYMENTS_PUBLIC_ID:-}
      CLOUDPAYMENTS_API_SECRET: ${CLOUDPAYMENTS_API_SECRET:-}
      CLOUDPAYMENTS_BASE_URL: ${CLOUDPAYMENTS_BASE_URL:-}
    ports:
      - "${TSFERA_BACKEND_PORT:-8080}:8080"
    volumes:
      # Каталог заполняется импортом дампа (make init / make deploy-dump).
      - ./data/attachments:/data/attachments
      # Вход консольных агентов в аккаунты (make claude-login / codex-login / agy-login).
      - ai_cli:/data/ai-cli
    extra_hosts:
      # Шлюз консольных агентов (agy) на этой же машине: http://host.docker.internal:7070
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "${TSFERA_FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend

volumes:
  pgdata:
  ai_cli:
